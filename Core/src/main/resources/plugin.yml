name: Core
version: '${project.version}'
main: me.x1no4ekk.core.CorePlugin
api-version: '1.21'
author: x1no4ekk
description: 'Ядро сервера: пользователи, хомы через Рог телепортации, утилиты (Paper 1.21.11, MySQL)'
load: POSTWORLD

softdepend:
  - Vault
  - PlaceholderAPI
  - Economy

commands:
  core:
    description: 'Администрирование плагина Core'
    usage: '/core <reload|horn> [игрок] [количество]'
    permission: core.admin
  sethome:
    description: 'Создать точку дома'
    usage: '/sethome <название>'
    permission: core.sethome
  delhome:
    description: 'Удалить точку дома'
    usage: '/delhome <название>'
    permission: core.delhome
  playerhome:
    description: 'Посмотреть точки дома игрока'
    usage: '/playerhome <игрок> [дом]'
    permission: core.playerhome
  home:
    description: 'Подсказка: телепортация домой работает только через Рог телепортации'
    usage: '/home'
    aliases: [homes]

  # ---- gameplay
  gamemode:
    description: 'Изменить режим игры'
    usage: '/gamemode <режим> [игрок]'
    aliases: [gm]
    permission: core.gamemode
  gms:
    description: 'Режим выживания'
    usage: '/gms [игрок]'
    permission: core.gamemode
  gmc:
    description: 'Творческий режим'
    usage: '/gmc [игрок]'
    permission: core.gamemode
  gma:
    description: 'Режим приключения'
    usage: '/gma [игрок]'
    permission: core.gamemode
  gmsp:
    description: 'Режим наблюдателя'
    usage: '/gmsp [игрок]'
    permission: core.gamemode
  fly:
    description: 'Включить/выключить полёт'
    usage: '/fly [игрок]'
    permission: core.fly
  flyelytra:
    description: 'Полёт на элитрах'
    usage: '/flyelytra [игрок]'
    aliases: [elytrafly]
    permission: core.flyelytra
  flyspeed:
    description: 'Скорость полёта'
    usage: '/flyspeed <1-10|reset> [игрок]'
    permission: core.flyspeed
  speed:
    description: 'Скорость ходьбы (в полёте — скорость полёта)'
    usage: '/speed <1-10|reset> [игрок]'
    permission: core.speed
  god:
    description: 'Режим бога'
    usage: '/god [игрок]'
    permission: core.god
  heal:
    description: 'Исцелить'
    usage: '/heal [игрок]'
    permission: core.heal
  feed:
    description: 'Утолить голод'
    usage: '/feed [игрок]'
    aliases: [food]
    permission: core.feed
  ext:
    description: 'Потушить огонь'
    usage: '/ext [игрок]'
    permission: core.ext
  burn:
    description: 'Поджечь игрока'
    usage: '/burn <игрок> [секунды]'
    permission: core.burn
  milk:
    description: 'Снять все эффекты'
    usage: '/milk [игрок]'
    permission: core.milk
  kill:
    description: 'Убить игрока'
    usage: '/kill <игрок>'
    permission: core.kill
  suicide:
    description: 'Покончить с собой'
    usage: '/suicide'
    permission: core.suicide
  more:
    description: 'Пополнить стак в руке'
    usage: '/more'
    aliases: [dupe]
    permission: core.more
  hat:
    description: 'Надеть предмет из руки на голову'
    usage: '/hat'
    permission: core.hat
  head:
    description: 'Получить голову игрока'
    usage: '/head [ник] [количество]'
    aliases: [skull]
    permission: core.head
  repair:
    description: 'Починить предметы'
    usage: '/repair [hand|all]'
    aliases: [fix]
    permission: core.repair
  itemrename:
    description: 'Переименовать предмет в руке'
    usage: '/itemrename <название|reset>'
    aliases: [rename]
    permission: core.itemrename
  itemdb:
    description: 'Информация о предмете в руке'
    usage: '/itemdb'
    aliases: [dura]
    permission: core.itemdb
  enchant:
    description: 'Зачаровать предмет в руке'
    usage: '/enchant <зачарование> [уровень]'
    permission: core.enchant
  give:
    description: 'Выдать предмет'
    usage: '/give <игрок> <предмет> [количество]'
    permission: core.give
  clearinventory:
    description: 'Очистить инвентарь'
    usage: '/clearinventory [игрок]'
    aliases: [ci]
    permission: core.clearinventory
  firework:
    description: 'Запустить фейерверки'
    usage: '/firework [сила]'
    permission: core.firework

  # ---- utility
  workbench:
    description: 'Открыть верстак'
    usage: '/workbench [игрок]'
    aliases: [wb, craft]
    permission: core.workbench
  anvil:
    description: 'Открыть наковальню'
    usage: '/anvil [игрок]'
    permission: core.anvil
  carttable:
    description: 'Открыть стол картографа'
    usage: '/carttable [игрок]'
    aliases: [cartographytable]
    permission: core.carttable
  etable:
    description: 'Открыть стол зачаровывания'
    usage: '/etable [игрок]'
    aliases: [enchanttable, enchantingtable]
    permission: core.etable
  grindstone:
    description: 'Открыть точило'
    usage: '/grindstone [игрок]'
    permission: core.grindstone
  loom:
    description: 'Открыть ткацкий станок'
    usage: '/loom [игрок]'
    permission: core.loom
  smithtable:
    description: 'Открыть кузнечный стол'
    usage: '/smithtable [игрок]'
    aliases: [smithingtable]
    permission: core.smithtable
  stonecutter:
    description: 'Открыть камнерез'
    usage: '/stonecutter [игрок]'
    permission: core.stonecutter
  invsee:
    description: 'Посмотреть инвентарь игрока'
    usage: '/invsee <игрок>'
    permission: core.invsee
  vanish:
    description: 'Режим невидимости'
    usage: '/vanish [игрок]'
    aliases: [v]
    permission: core.vanish
  spectate:
    description: 'Слежка за игроком в режиме наблюдателя'
    usage: '/spectate <игрок>'
    aliases: [spec]
    permission: core.spectate
  spectatestop:
    description: 'Закончить слежку за игроком'
    usage: '/spectatestop'
    aliases: [specstop, specoff]
    permission: core.spectatestop
  whois:
    description: 'Информация об игроке'
    usage: '/whois <игрок>'
    permission: core.whois
  realname:
    description: 'Узнать настоящий ник игрока'
    usage: '/realname <ник>'
    aliases: [rn]
    permission: core.realname
  nick:
    description: 'Установить ник'
    usage: '/nick <ник|off> [игрок]'
    aliases: [nickname]
    permission: core.nick
  kick:
    description: 'Кикнуть игрока'
    usage: '/kick <игрок> [причина]'
    permission: core.kick
  gc:
    description: 'Состояние сервера: TPS, память, миры'
    usage: '/gc'
    aliases: [lag]
    permission: core.gc
  ping:
    description: 'Пинг'
    usage: '/ping [игрок]'
    permission: core.ping
  list:
    description: 'Список игроков онлайн'
    usage: '/list'
    aliases: [online]
    permission: core.list
  near:
    description: 'Игроки рядом'
    usage: '/near [радиус]'
    permission: core.near
  getpos:
    description: 'Координаты'
    usage: '/getpos [игрок]'
    aliases: [coords]
    permission: core.getpos
  compass:
    description: 'Куда вы смотрите'
    usage: '/compass'
    permission: core.compass
  gps:
    description: 'Навигация к точке или игроку'
    usage: '/gps <x> [y] <z> [мир] | <игрок> | off'
    permission: core.gps
  date:
    description: 'Дата и время сервера'
    usage: '/date'
    permission: core.date
  rules:
    description: 'Правила сервера'
    usage: '/rules'
    aliases: [rule]
    permission: core.rules
  links:
    description: 'Ссылки сервера'
    usage: '/links'
    aliases: [link]
    permission: core.links
  day:
    description: 'Установить день'
    usage: '/day [мир]'
    permission: core.day
  night:
    description: 'Установить ночь'
    usage: '/night [мир]'
    permission: core.night
  time:
    description: 'Время мира'
    usage: '/time [set] <day|night|noon|midnight|тики> [мир] | /time add <тики> [мир]'
    permission: core.time
  sun:
    description: 'Ясная погода'
    usage: '/sun [секунды] [мир]'
    permission: core.sun
  rain:
    description: 'Дождь'
    usage: '/rain [секунды] [мир]'
    permission: core.rain
  storm:
    description: 'Гроза'
    usage: '/storm [секунды] [мир]'
    permission: core.storm
  weather:
    description: 'Погода мира'
    usage: '/weather <clear|rain|thunder> [секунды] [мир]'
    permission: core.weather
  ptime:
    description: 'Личное время'
    usage: '/ptime [время|reset] [игрок]'
    aliases: [playertime]
    permission: core.ptime
  pweather:
    description: 'Личная погода'
    usage: '/pweather [погода|reset] [игрок]'
    aliases: [playerweather]
    permission: core.pweather

  # ---- travel
  tp:
    description: 'Телепортироваться к игроку или телепортировать игрока к другому'
    usage: '/tp <игрок> [цель]'
    permission: core.tp
  tphere:
    description: 'Телепортировать игрока к себе'
    usage: '/tphere <игрок>'
    permission: core.tphere
  tppos:
    description: 'Телепортироваться по координатам'
    usage: '/tppos <x> <y> <z> [мир] [поворот наклон]'
    permission: core.tppos
  tpall:
    description: 'Телепортировать всех игроков к себе'
    usage: '/tpall'
    permission: core.tpall
  tpa:
    description: 'Запросить телепортацию к игроку'
    usage: '/tpa <игрок>'
    aliases: [call]
    permission: core.tpa
  tpahere:
    description: 'Позвать игрока к себе'
    usage: '/tpahere <игрок>'
    permission: core.tpahere
  tpaccept:
    description: 'Принять запрос на телепортацию'
    usage: '/tpaccept [игрок]'
    aliases: [tpyes, tpallow]
    permission: core.tpaccept
  tpdeny:
    description: 'Отклонить запрос на телепортацию'
    usage: '/tpdeny [игрок]'
    aliases: [tpno]
    permission: core.tpdeny
  tpcancel:
    description: 'Отменить свой запрос на телепортацию'
    usage: '/tpcancel [игрок]'
    aliases: [tpacancel]
    permission: core.tpcancel
  teleportcancel:
    description: 'Отменить ожидание телепортации'
    usage: '/teleportcancel'
    permission: core.teleportcancel
  tptoggle:
    description: 'Включить или выключить телепортации к себе'
    usage: '/tptoggle'
    permission: core.tptoggle
  back:
    description: 'Вернуться на предыдущую позицию'
    usage: '/back'
    permission: core.back
  top:
    description: 'Подняться на самый верхний блок'
    usage: '/top'
    permission: core.top
  setspawn:
    description: 'Установить точку спавна'
    usage: '/setspawn'
    permission: core.setspawn
  spawn:
    description: 'Телепортироваться на спавн'
    usage: '/spawn [игрок]'
    permission: core.spawn
  rtp:
    description: 'Случайная телепортация'
    usage: '/rtp [режим]'
    aliases: [tpr, randomtp]
    permission: core.rtp
  warp:
    description: 'Меню варпов или телепортация на варп'
    usage: '/warp [варп]'
    aliases: [warps]
    permission: core.warp
  setwarp:
    description: 'Создать варп'
    usage: '/setwarp <название> [описание]'
    aliases: [createwarp, addwarp]
    permission: core.setwarp
  delwarp:
    description: 'Удалить варп'
    usage: '/delwarp <варп>'
    aliases: [deletewarp, removewarp, remwarp]
    permission: core.delwarp
  warpinfo:
    description: 'Информация о варпе'
    usage: '/warpinfo <варп>'
    permission: core.warpinfo
  editwarp:
    description: 'Изменить описание, иконку или позицию своего варпа'
    usage: '/editwarp <варп> <description|icon|move> [значение]'
    permission: core.editwarp
  serverwarp:
    description: 'Варпы сервера'
    usage: '/serverwarp [create|delete|list|icon|slot|description|move]'
    aliases: [systemwarp]
    permission: core.serverwarp
  killtop:
    description: 'Топ игроков по убийствам'
    usage: '/killtop [страница]'
    aliases: [topkills, topkill]
    permission: core.killtop
  deathtop:
    description: 'Топ игроков по смертям'
    usage: '/deathtop [страница]'
    aliases: [topdeaths]
    permission: core.deathtop
  baltop:
    description: 'Топ игроков по балансу'
    usage: '/baltop [страница]'
    aliases: [balancetop, topbal]
    permission: core.baltop

permissions:
  core.admin:
    description: 'Доступ к /core reload и /core horn'
    default: op
  core.sethome:
    description: 'Создание точек дома'
    default: true
  core.delhome:
    description: 'Удаление точек дома'
    default: true
  core.playerhome:
    description: 'Просмотр и телепортация к точкам дома других игроков'
    default: op
  core.horn.use:
    description: 'Использование Рога телепортации'
    default: true
  core.horn.craft:
    description: 'Крафт Рога телепортации'
    default: true
  core.horn.bypass-cooldown:
    description: 'Использование Рога телепортации без перезарядки'
    default: op
  core.homes.unlimited:
    description: 'Без ограничения количества точек дома'
    default: op
  core.teleport.bypass-warmup:
    description: 'Телепортация без задержки'
    default: op
  core.back.ondeath:
    description: 'Возврат на место смерти через /back'
    default: true
  core.combat.bypass:
    description: 'Не попадать в боевой режим'
    default: false

