  dropped: '<prefix><gray>Часть предметов не поместилась в инвентарь и выпала рядом.'
  pickup-blocked: '<prefix><gray>Нельзя подбирать предметы в режиме полёта или бога.'

  gamemode:
    usage:
      - '<gold>┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
      - '<gold>┃ <gray>Изменить режим игры: <red>/gamemode \<режим> [игрок]'
      - '<gold>┃ <gray>Режимы: <red>0</red>/<red>s</red> — выживание, <red>1</red>/<red>c</red> — творческий,'
      - '<gold>┃ <red>2</red>/<red>a</red> <gray>— приключение, <red>3</red>/<red>sp</red> <gray>— наблюдатель'
      - '<gold>┃ <gray>Быстрые команды: <red>/gms</red>, <red>/gmc</red>, <red>/gma</red>, <red>/gmsp</red> <red>[игрок]'
      - '<gold>┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
