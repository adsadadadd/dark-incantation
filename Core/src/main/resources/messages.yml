  cooldown: '<prefix><gray>Подождите ещё <gold><time></gold>.'
  player-only-online: '<prefix><gray>Игрок <gold><player></gold> должен быть онлайн.'

core:
  usage:
    - '<gold>┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
