  invalid-name: '<prefix><red>Недопустимое название точки дома.'
  limit: '<prefix><gray>Максимальное количество ваших точек дома: <gold><limit></gold>.'
  already-exists: '<prefix><gray>У вас уже есть точка дома <gold><home></gold>.'
  created: '<prefix><gray>Вы создали точку дома <gold><home></gold>. Используйте <gold>Рог телепортации</gold>, чтобы вернуться.'
  deleted: '<prefix><gray>Вы удалили точку дома <gold><home></gold>.'
  disabled-world: '<prefix><red>В этом мире нельзя создавать точки дома.'
  spectator: '<prefix><red>Нельзя создать точку дома в режиме наблюдателя.'
  player-empty: '<prefix><gray>У игрока <gold><player></gold> нет точек дома.'
  player-teleported: '<prefix><gray>Вы телепортировались к точке дома <gold><home></gold> игрока <gold><player></gold>.'

horn:
