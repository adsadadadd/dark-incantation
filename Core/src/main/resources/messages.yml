  cooldown: '<prefix><gray>Рог перезаряжается ещё <gold><seconds></gold> сек.'

teleport:
  warmup: '<prefix><gray>Телепортация через <gold><seconds></gold> сек. Не двигайтесь!'
  bossbar: '<green>Телепортация через <white><seconds></white> сек.'
  cancelled-move: '<prefix><red>Телепортация отменена: вы сдвинулись с места.'
  cancelled-damage: '<prefix><red>Телепортация отменена: вы получили урон.'
  cancelled-combat: '<prefix><red>Телепортация отменена: вы вступили в бой.'
