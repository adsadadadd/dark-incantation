  ended: '<prefix><green>Вы вышли из боя.'
  action-bar: '<red>⚔ В бою: <white><seconds></white> сек.'
  action-bar-ended: '<green>⚔ Вы вышли из боя'
  command-blocked: '<prefix><red>Эта команда недоступна в бою! Осталось <gold><seconds></gold> сек.'
