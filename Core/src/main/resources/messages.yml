  database-error: '<prefix><red>Ошибка базы данных. Попробуйте позже.'
  load-failed-kick: '<red>Не удалось загрузить ваши данные.<newline><gray>Попробуйте зайти ещё раз через минуту.'
  reloaded: '<prefix><green>Конфигурация перезагружена.'
  reload-failed: '<prefix><red>Ошибка в конфигурации, оставлены прежние настройки: <gray><error>'
