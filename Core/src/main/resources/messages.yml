      - '<gold>┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
      - '<gold>┃ <gray>Изменить режим игры: <red>/<command> [игрок]'
      - '<gold>┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    unknown: '<prefix><gray>Режим игры <gold><mode></gold> не найден.'
    already: '<prefix><gray>У вас уже режим игры <gold><mode></gold>.'
    already-other: '<prefix><gray>У игрока <gold><player></gold> уже режим игры <gold><mode></gold>.'
    cancelled: '<prefix><red>Не удалось изменить режим игры.'
    changed: '<prefix><gray>Ваш режим игры изменён на <gold><mode></gold>.'
    changed-other: '<prefix><gray>Режим игры игрока <gold><player></gold> изменён на <gold><mode></gold>.'
    names:
      survival: 'выживание'
      creative: 'творческий'
      adventure: 'приключение'
      spectator: 'наблюдатель'

