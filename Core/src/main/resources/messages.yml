  not-found: '<prefix><gray>Дом <gold><home></gold> не найден.'
  teleported: '<prefix><gray>Вы телепортировались к дому <gold><home></gold>.'
  teleport-failed: '<prefix><red>Не удалось телепортироваться к дому <gold><home></gold>.'
  world-not-loaded: '<prefix><red>Мир <gold><world></gold> недоступен.'
  sethome-usage:
    - '<gold>┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - '<gold>┃ <gray>Создать точку дома: <red>/sethome \<название>'
