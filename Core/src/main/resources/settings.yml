# ==========================================================
#  Core — основные настройки (Paper 1.21.11)
#  Автор: x1no4ekk
#  Все тексты поддерживают MiniMessage: <red>, <#ff8800>, <gradient:...>, <bold> и т.д.
# ==========================================================

# Подключение к MySQL (обязательно). Если подключиться не удалось — плагин выключится.
database:
  host: 'localhost'
  port: 3306
  name: 'minecraft'
  username: 'root'
  password: ''
  # Класс JDBC-драйвера. MySQL Connector/J уже встроен в Paper.
  driver-class: 'com.mysql.cj.jdbc.Driver'
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    # Все значения ниже — в миллисекундах
    connection-timeout: 5000
    idle-timeout: 600000
    max-lifetime: 1800000
    keepalive-time: 0
    # 0 — выключено. Например, 10000 — предупреждение в консоль, если соединение не возвращено в пул за 10 секунд.
    leak-detection-threshold: 0
  # Дополнительные свойства JDBC-драйвера
  properties:
    useSSL: 'false'
    allowPublicKeyRetrieval: 'true'
    useUnicode: 'true'
    characterEncoding: 'utf8'
    serverTimezone: 'UTC'
    cachePrepStmts: 'true'
    prepStmtCacheSize: '250'
    prepStmtCacheSqlLimit: '2048'
    useServerPrepStmts: 'true'
    rewriteBatchedStatements: 'true'
    cacheServerConfiguration: 'true'
    elideSetAutoCommits: 'true'
    maintainTimeStats: 'false'

users:
  # Как часто сохранять изменённые данные онлайн-игроков (в минутах)
  autosave-interval-minutes: 5
  # Максимальное время загрузки данных игрока при входе (в секундах). При превышении вход отклоняется.
  load-timeout-seconds: 10

homes:
  # Количество точек дома по умолчанию
  default-limit: 1
  # Лимиты по правам: core.homes.<группа>. Берётся максимальное значение из доступных.
  # Право core.homes.unlimited снимает ограничение.
  limits:
    vip: 3
    premium: 5
    admin: 10
  # Допустимое название точки дома (регулярное выражение)
  name-pattern: '^[a-zA-Zа-яА-ЯёЁ0-9_-]{1,16}$'
  # Миры, в которых нельзя ставить точки дома
  disabled-worlds: []

# Рог телепортации — единственный способ телепортироваться к своим точкам дома
teleport-horn:
  name: '<gradient:#ffd36b:#ff8a3d><bold>Рог телепортации</bold></gradient>'
  lore:
    - ''
    - '<gray>Древний рог, хранящий память</gray>'
    - '<gray>о ваших точках дома.</gray>'
    - ''
    - '<yellow>ПКМ</yellow> <gray>— открыть список домов</gray>'
  # Эффект зачарования на предмете
  glint: true
  # Инструмент рога (влияет на описание предмета): ponder, sing, seek, feel, admire, call, yearn, dream
  instrument: 'minecraft:ponder_goat_horn'
  # Перезарядка после телепортации (в секундах). 0 — без перезарядки.
  cooldown-seconds: 10
  # Звук при телепортации
  sound:
    key: 'minecraft:item.goat_horn.sound.0'
    volume: 1.0
    pitch: 1.0
  recipe:
    enabled: true
    # Открыть рецепт в книге рецептов при входе
    discover-on-join: true
    # Сетка 3x3. Пробел — пустая ячейка.
    shape:
      - 'EDE'
      - 'DHD'
      - 'EDE'
    ingredients:
      E: ENDER_PEARL
      D: DIAMOND
      H: GOAT_HORN

# Меню домов (HomeGui)
home-gui:
  title: '<dark_gray>Точки дома</dark_gray>'
  # Заголовок при просмотре чужих домов (/playerhome). <player> — ник владельца
  title-other: '<dark_gray>Дома игрока <gold><player></gold></dark_gray>'
  rows: 6
  # Слоты для иконок домов
  content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  filler:
    enabled: true
    material: ORANGE_STAINED_GLASS_PANE
  home-item:
    # Материал иконки в зависимости от типа мира
    materials:
      NORMAL: GRASS_BLOCK
      NETHER: NETHERRACK
      THE_END: END_STONE
      CUSTOM: COMPASS
    # Плейсхолдеры: <home>, <world>, <x>, <y>, <z>
    name: '<gold><bold><home></bold></gold>'
    lore:
      - ''
      - '<gray>Координаты дома:</gray>'
      - ' <gray>Мир: <red><world></red></gray>'
      - ' <gray>X: <red><x></red></gray>'
      - ' <gray>Y: <red><y></red></gray>'
      - ' <gray>Z: <red><z></red></gray>'
      - ''
      - '<green><bold>Нажмите</bold></green><gray>, чтобы телепортироваться</gray>'
  empty-item:
    slot: 22
    material: BARRIER
    name: '<red>У вас нет точек дома</red>'
    lore:
      - '<gray>Создайте точку дома командой</gray>'
      - '<yellow>/sethome \<название></yellow>'
  previous-page:
    slot: 47
    material: ARROW
    name: '<yellow>← Предыдущая страница</yellow>'
  next-page:
    slot: 51
    material: ARROW
    name: '<yellow>Следующая страница →</yellow>'
  close:
    slot: 49
    material: SPECTRAL_ARROW
    name: '<red>Закрыть</red>'

# ==========================================================
#  Телепортация (общая для /spawn, /warp, /tpa, /rtp, /back и базы гильдии)
# ==========================================================
teleport:
  # Задержка перед телепортацией (в секундах). 0 — мгновенно. Право core.teleport.bypass-warmup — без задержки.
  warmup-seconds: 4
  # Отменять телепортацию, если игрок сдвинулся с блока
  cancel-on-move: true
  # Отменять телепортацию при получении урона
  cancel-on-damage: true
  # Полоса прогресса во время ожидания (текст — teleport.bossbar в messages.yml)
  bossbar:
    enabled: true
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: GREEN
    # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    overlay: PROGRESS
  # Частицы вокруг игрока во время ожидания
  particles:
    enabled: true
    color: '#00e676'
    size: 1.0
    count: 6
  # Неуязвимость после телепортации (в секундах). 0 — выключено.
  protection-seconds: 3.5
  # Запоминать место смерти для /back (нужно право core.back.ondeath)
  back-on-death: true
  # Звук по прибытии. Пустой key — без звука.
  arrival-sound:
    key: 'minecraft:entity.enderman.teleport'
    volume: 0.6
    pitch: 1.2

# ==========================================================
#  Боевой режим (анти-релог)
# ==========================================================
combat:
  enabled: true
  # Сколько секунд длится бой после последнего удара
  duration-seconds: 20
  # Отключать полёт (/fly) на время боя и возвращать после
  disable-fly: true
  # Запрещать полёт на элитрах во время боя
  disable-gliding: false
  # Отменять ожидание телепортации при начале боя
  cancel-teleport: true
  # Обратный отсчёт над хотбаром
  action-bar: true
  # Миры, где бой не учитывается
  disabled-worlds: []
  commands:
    # blacklist — запрещены команды из списка; whitelist — разрешены только команды из списка
    mode: blacklist
    # Можно указывать подкоманды: 'g home'
    list:
      - spawn
      - warp
      - warps
      - tpa
      - tpahere
      - tpaccept
      - tpyes
      - back
      - rtp
      - fly
      - ec
      - enderchest
      - kit
      - kits
      - home
      - homes
      - g home
      - guild home
      - guilds home
  # Наказание за выход из игры во время боя
  punish-on-quit:
    enabled: true
    # Убить игрока (вещи выпадут)
    kill: true
    # Сообщение всем игрокам (combat.logout-broadcast)
    broadcast: true
    # Команды от консоли. %player% — ник, %uuid% — UUID
    commands: []
    # Причины выхода, за которые наказывать: DISCONNECTED, TIMED_OUT, KICKED, ERRONEOUS_STATE
    reasons:
      - DISCONNECTED
      - TIMED_OUT

# ==========================================================
#  Модуль: gameplay
# ==========================================================
gameplay:
  fly:
    # Перезарядка (в секундах) на включение/выключение полёта другим игрокам через /fly <игрок>. 0 — без перезарядки.
    # Право core.fly.others.bypass-cooldown — без перезарядки.
    others-cooldown-seconds: 60
    # Запрещать подбирать предметы с включённым /fly или /flyelytra (право core.fly.bypass-pickup — можно)
    block-pickup: true
    # Если игрок с /fly зашёл в игру в воздухе — сразу включать полёт, чтобы он не разбился
    safe-login: true
  # Полёт на элитрах (/flyelytra): пока надеты элитры, можно летать как с /fly
  fly-elytra:
    enabled: true
    # Сколько прочности элитр тратится за каждую секунду полёта (зачарование «Прочность» учитывается). 0 — не тратится.
    durability-per-second: 1
    # Отключать полёт на элитрах на время боя (вернётся после окончания боя)
    disable-in-combat: true
  # Режим бога (/god): игрок не получает урон (кроме пустоты и /kill)
  god:
    # Не тратить сытость
    keep-food: true
    # Мобы не нападают на игрока
    prevent-mob-target: true
    # Игрок в режиме бога не может наносить урон другим игрокам
    block-pvp: true
    # Запрещать подбирать предметы (право core.god.bypass-pickup — можно)
    block-pickup: true
    # Восстанавливать здоровье и сытость при включении
    heal-on-enable: true
  speed:
    # Сбрасывать скорость ходьбы и полёта (/speed, /flyspeed) при выходе из игры
    reset-on-quit: true
  heal:
    # /heal снимает негативные эффекты (отравление, слабость, иссушение...)
    remove-negative-effects: true
  burn:
    # Время горения по умолчанию для /burn <игрок> (в секундах)
    default-seconds: 10
    # Максимальное время горения (в секундах)
    max-seconds: 300
  give:
    # Максимальное количество предметов за одну команду /give
    max-amount: 2304
  head:
    # Максимальное количество голов за одну команду /head
    max-amount: 64
  # Стоимость починки в АР (нужен плагин экономики). 0 — бесплатно. Право core.repair.free — бесплатно.
  repair:
    # /repair — предмет в руке
    cost: 100
    # /repair all — весь инвентарь за раз
    all-cost: 5000
  itemrename:
    # Максимальная длина названия (без учёта цветовых тегов)
    max-length: 50
    # Приставка к названию (MiniMessage) для игроков без права core.itemrename.noprefix. '' — без приставки.
    prefix: '<gold><bold>ПЕРЕИМЕНОВАН:</bold></gold> <white>'
  firework:
    # Сколько фейерверков запускает /firework
    count: 3
    # Сила (высота полёта) по умолчанию и максимальная сила, которую можно указать (0-10)
    default-power: 1
    max-power: 3
    # Перезарядка (в секундах). Право core.firework.bypass-cooldown — без перезарядки.
    cooldown-seconds: 5
    # Взрывы фейерверков из /firework не наносят урон
    harmless: true

# ==========================================================
#  Модуль: utility
# ==========================================================
# Утилиты: виртуальные верстаки, модерация, информационные команды, время и погода
utility:
  # Виртуальные верстаки (/workbench, /anvil, ...): заголовки окон (MiniMessage)
  workstations:
    titles:
      workbench: '<dark_gray>Верстак'
      anvil: '<dark_gray>Наковальня'
      carttable: '<dark_gray>Стол картографа'
      etable: '<dark_gray>Стол зачаровывания'
      grindstone: '<dark_gray>Точило'
      loom: '<dark_gray>Ткацкий станок'
      smithtable: '<dark_gray>Кузнечный стол'
      stonecutter: '<dark_gray>Камнерез'

  # Режим невидимости (/vanish)
  vanish:
    # Как часто напоминать в action bar «Вы в режиме невидимости» (в секундах, 1-60). 0 — не напоминать.
    action-bar-interval-seconds: 2
    # Показывать фальшивое сообщение о выходе (при включении) и входе (при выключении)
    # игрокам, которые не видят невидимок (тексты: utility.vanish.fake-quit / fake-join в messages.yml)
    fake-messages: false
    # Не учитывать невидимок в онлайне и списке игроков в меню серверов
    hide-from-server-list: true

  # Слежка за игроком (/spectate)
  spectate:
    # Максимальное расстояние от цели (в блоках). Отлетевший дальше наблюдатель возвращается к цели. 0 — без ограничения.
    max-distance: 10
    # Сразу смотреть «глазами» цели. Выйти из камеры можно клавишей Shift.
    attach-camera: false

  # Никнеймы (/nick). Право core.nick.color разрешает цвета и стили MiniMessage (<red>, <gradient:...>, <bold>).
  nick:
    # Минимальная и максимальная длина ника без учёта цветов
    min-length: 3
    max-length: 16
    # Допустимые символы ника без учёта цветов (регулярное выражение)
    pattern: '^[a-zA-Zа-яА-ЯёЁ0-9_]+$'
    # Запрещённые слова: ник не может их содержать (без учёта регистра)
    forbidden:
      - 'admin'
      - 'админ'
      - 'moder'
      - 'модер'
      - 'owner'
      - 'console'
      - 'консоль'
    # Как ник отображается в чате и над игроком. <nickname> — сам ник.
    # Значок «~» показывает, что это не настоящее имя (его можно убрать: '<nickname>').
    display-format: '<gray>~</gray><nickname>'
    # Показывать ник в списке игроков (Tab)
    tab-list: true
    # Запрещать ники, совпадающие с именем любого игрока, который когда-либо заходил на сервер (проверка в MySQL)
    check-registered-names: true

  # Информация об игроке (/whois)
  whois:
    # Формат дат первого и последнего входа (часовой пояс — utility.date.zone)
    date-format: 'dd.MM.yyyy HH:mm'

  # Игроки рядом (/near [радиус])
  near:
    # Радиус по умолчанию (в блоках)
    default-radius: 200
    # Максимальный радиус, который можно указать
    max-radius: 200
    # Увеличенный максимальный радиус по правам: core.near.radius.<ключ>. Берётся наибольшее доступное значение.
    radius-permissions:
      vip: 300
      admin: 1000
    # Сколько игроков показывать в списке
    max-entries: 15
    # Не показывать игроков под эффектом невидимости
    hide-invisible: true

  # Навигатор (/gps)
  gps:
    # Навигация к координатам выключается, когда до точки осталось столько блоков. 0 — не выключать.
    arrive-distance: 5

  # Дата и время сервера (/date). Форматы — шаблоны Java DateTimeFormatter.
  date:
    # Часовой пояс, например Europe/Moscow, Europe/Kyiv, Asia/Yekaterinburg
    zone: 'Europe/Moscow'
    date-format: 'dd.MM.yyyy'
    time-format: 'HH:mm:ss'

  # Список игроков (/list): группы Vault/LuckPerms (ключ — название группы в нижнем регистре) и их подписи.
  # Группы выводятся в указанном порядке, остальные — после них. Игроки без группы попадают в «default».
  list:
    groups:
      admin: '<dark_red>Администрация'
      moderator: '<gold>Модерация'
      vip: '<green>VIP'
      default: '<gray>Игроки'

  # Правила сервера (/rules): строки MiniMessage, <prefix> — префикс из messages.yml
  rules:
    lines:
      - '<gold>┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
      - '<gold>┃ <white>1. <gray>Уважайте других игроков.'
      - '<gold>┃ <white>2. <gray>Запрещены читы и использование багов.'
      - '<gold>┃ <white>3. <gray>Запрещены гриферство и воровство.'
      - '<gold>┃ <gray>Полные правила: <click:open_url:''https://vk.com/your_server''><hover:show_text:''<gray>Открыть''><gold><u>vk.com/your_server</u></hover></click>'
      - '<gold>┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'

  # Ссылки (/links): строки MiniMessage, кликабельные через <click:open_url:'...'>
  links:
    lines:
      - '<gold>┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
      - '<gold>┃ <gray>Мы во ВКонтакте: <click:open_url:''https://vk.com/your_server''><hover:show_text:''<gray>Открыть''><gold><u>vk.com/your_server</u></hover></click>'
      - '<gold>┃ <gray>Мы в Telegram: <click:open_url:''https://t.me/your_server''><hover:show_text:''<gray>Открыть''><gold><u>t.me/your_server</u></hover></click>'
      - '<gold>┃ <gray>Наш Discord: <click:open_url:''https://discord.gg/your_server''><hover:show_text:''<gray>Открыть''><gold><u>discord.gg/your_server</u></hover></click>'
      - '<gold>┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'

  # Время мира (/day, /night, /time)
  time:
    # Миры, где можно менять время. Пустой список — все миры.
    # Без указания мира команда меняет время в мире игрока (если он разрешён), иначе — в первом разрешённом мире.
    worlds:
      - 'world'
    # Общая перезарядка смены времени для каждого мира (в секундах). 0 — без перезарядки.
    # Право core.time.bypass-cooldown игнорирует перезарядку.
    cooldown-seconds: 60

  # Погода мира (/sun, /rain, /storm, /weather)
  weather:
    # Миры, где можно менять погоду. Пустой список — все миры.
    worlds:
      - 'world'
    # Общая перезарядка смены погоды для каждого мира (в секундах). 0 — без перезарядки.
    # Право core.weather.bypass-cooldown игнорирует перезарядку.
    cooldown-seconds: 60
    # Длительность погоды, если она не указана в команде (в секундах). 0 — случайная, как в ванильной /weather.
    default-duration-seconds: 0

  # Меню личного времени (/ptime). Кнопки — предметы меню: slot или slots, material, amount, name, lore, glint, hide-tooltip.
  ptime-menu:
    title: '<dark_gray>Личное время'
    rows: 5
    # Звук при открытии меню (пустой key — без звука)
    sound:
      key: 'minecraft:block.note_block.bell'
      volume: 1.0
      pitch: 1.0
    # Закрывать меню после выбора
    close-on-click: true
    # Фон меню (можно удалить секцию). Кнопки ниже ставятся поверх фона.
    filler:
      slots: [0-44]
      material: GRAY_STAINED_GLASS_PANE
      hide-tooltip: true
    # Варианты времени. Ключ — аргумент команды (/ptime morning); ticks — время суток в тиках
    # (0 — рассвет, 6000 — полдень, 12000 — закат, 18000 — полночь); label — название в сообщениях.
    # В name/lore доступны <time> (label), <ticks> и <clock> (игровые часы).
    options:
      morning:
        ticks: 0
        label: '<yellow>утро'
        slot: 19
        material: CLOCK
        name: '<yellow>Утро'
        lore:
          - ''
          - '<gray>Установить личное время'
          - '<gray>на <time> <dark_gray>(<clock>)'
          - ''
          - '<green>Нажмите, чтобы выбрать'
      day:
        ticks: 6000
